<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#ef476f">
<meta name="geo.region" content="AR-X">
<meta name="geo.placename" content="Río Segundo, Córdoba">
<meta name="geo.position" content="{{site.lat}};{{site.lng}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:locale" content="es_AR">
<meta property="og:site_name" content="Bongi Bombón">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Bongi Bombón, golosinería en Río Segundo, Córdoba">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="/css/main.css?v={{today}}">
{{extraHead}}
<script type="application/ld+json">
{{jsonld}}
</script>
</head>
<body class="{{bodyClass}}">
<a class="skip" href="#contenido">Saltar al contenido</a>
{{> header}}
<main id="contenido">
{{content}}
</main>
{{> footer}}
<nav class="action-bar" aria-label="Acciones rápidas">
  <a href="https://wa.me/{{site.whatsapp}}?text=%C2%A1Hola%20Bongi%20Bomb%C3%B3n!%20Quiero%20hacer%20una%20consulta." class="action-bar__btn action-bar__btn--wa" data-track="whatsapp_click" data-track-label="barra_movil" rel="noopener" target="_blank">
    <svg aria-hidden="true" viewBox="0 0 24 24"><use href="/assets/brand/iconos.svg#whatsapp"/></svg>WhatsApp</a>
  <a href="{{site.mapsUrl}}" class="action-bar__btn" data-track="maps_click" data-track-label="barra_movil" rel="noopener" target="_blank">
    <svg aria-hidden="true" viewBox="0 0 24 24"><use href="/assets/brand/iconos.svg#pin"/></svg>Cómo llegar</a>
  <a href="/juegos" class="action-bar__btn">
    <svg aria-hidden="true" viewBox="0 0 24 24"><use href="/assets/brand/iconos.svg#joystick"/></svg>Juegos</a>
</nav>
<script type="application/json" id="bb-config">{{configJson}}</script>
<script type="module" src="/js/site.js?v={{today}}"></script>
{{scripts}}
</body>
</html>
